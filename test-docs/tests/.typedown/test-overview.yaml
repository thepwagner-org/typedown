version: 2
description: >-
  The test-docs overview page. Exercises from_directory title mode (the parent
  directory is named "tests"), the structure-level intro section (content
  between H1 and the first H2), and link target_type without bidirectional.
paths:
  - "OVERVIEW.md"
frontmatter:
  type: object
  properties:
    maintained_by:
      type: string
    version:
      type: string
  required:
    - maintained_by

structure:
  title: from_directory
  strict_sections: true
  intro:
    bullets: unordered
  sections:
    - title: Sections
      required: true
      bullets: unordered
      links:
        target_type: test-index
    - title: Coverage
      required: true
      bullets: unordered
      template: "- **Text**: Text"
    - title: Running the Suite
      required: true
