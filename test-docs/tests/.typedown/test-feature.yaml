version: 2
description: >-
  A typedown feature test document. Describes a feature while being validated
  by it. Each file exercises specific schema capabilities so a dumb agent
  breaking the file gets caught by the very feature it's editing.
paths:
  - "features/*.md"
frontmatter:
  type: object
  properties:
    status:
      type: string
      enum:
        - passing
        - failing
        - untested
    complexity:
      type: integer
    added:
      type: string
      format: date
    breaking:
      type: boolean
    tags:
      type: array
      items:
        type: string
        enum:
          - frontmatter
          - structure
          - links
          - formatting
          - auto-fix
          - json
  required:
    - status
    - complexity

structure:
  title: from_filename
  strict_sections: true
  size_warning: 2000
  sections:
    - title: What It Tests
      required: true
      description: Explain what this feature validates and why it matters.
    - title: How to Break It
      required: true
      bullets: unordered
      template: "- **Text**: Text"
    - title: Expected Errors
      required: true
      bullets: ordered
    - title: Related Features
      links:
        target_type: test-feature
        bidirectional: true
    - title: External Links
      links:
        target_type: test-hardware
    - title: Notes
