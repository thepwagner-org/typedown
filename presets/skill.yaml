version: 2
description: >-
  A coding agent skill (SKILL.md). Provides reusable instructions loaded
  on-demand via the skill tool. The directory name must match the frontmatter
  name field.
paths:
  - "**/skills/*/SKILL.md"
frontmatter:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    license:
      type: string
    compatibility:
      type: string
  required:
    - name
    - description

structure:
  title: none
  strict_sections: false
